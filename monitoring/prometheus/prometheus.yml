global:
  scrape_interval: 5s      # short, so a demo shows movement quickly; 15-30s is normal in production
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ledgerforge
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password: dev-only-metrics-password   # local demo value; see LEDGERFORGE_METRICS_PASSWORD in compose.yaml
    static_configs:
      - targets: ["app:8080"]
    metric_relabel_configs:
      # The Prometheus client reserves the "_created" suffix for OpenMetrics timestamps and strips
      # it, so the application exports payments_total. Stored under the intended name here.
      - source_labels: [__name__]
        regex: payments_total
        target_label: __name__
        replacement: payments_created_total
