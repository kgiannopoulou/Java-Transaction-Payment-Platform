spring:
  application:
    name: ledgerforge
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${LEDGERFORGE_DB_URL:jdbc:postgresql://localhost:5437/ledgerforge}
    username: ${LEDGERFORGE_DB_USER:ledgerforge}
    password: ${LEDGERFORGE_DB_PASSWORD:ledgerforge}
    hikari:
      maximum-pool-size: 20
      pool-name: ledgerforge-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      # Pure JSON API: no static content. Unknown routes then raise NoHandlerFoundException,
      # which ApiExceptionHandler renders in the standard error shape.
      add-mappings: false
  data:
    redis:
      host: ${LEDGERFORGE_REDIS_HOST:localhost}
      port: ${LEDGERFORGE_REDIS_PORT:6381}
      # Short on purpose: Redis is an optimisation, and a hanging one must not hang payments.
      timeout: 200ms
      connect-timeout: 200ms
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${LEDGERFORGE_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      # The outbox relay marks an event published only after this acknowledgement.
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # Commit each record's offset after the listener (and its DB transaction) succeeded.
      ack-mode: record

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    # Belt and braces: ApiExceptionHandler already handles everything, but never let the
    # container's fallback error page leak internals either.
    include-stacktrace: never
    include-exception: false
    include-message: never

logging:
  pattern:
    # Prefix every log line with the request's trace id (see TraceIdFilter).
    correlation: "[%X{traceId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      # Health is public (probes); component details only for admins.
      show-details: when-authorized
      roles: ADMIN

ledgerforge:
  concurrency:
    # PESSIMISTIC (default): SELECT ... FOR UPDATE in deterministic id order.
    # OPTIMISTIC: @Version checks + bounded retries.
    # NAIVE: unsafe read-modify-write, exists only to reproduce lost updates in tests.
    locking-mode: PESSIMISTIC
    max-attempts: 8
    initial-backoff: 10ms
    max-backoff: 200ms
    # Artificial delay between reading balances and writing them. Used by race tests to
    # widen the race window; must stay 0 in real deployments.
    simulated-latency: 0ms
  idempotency:
    ttl: 24h
    cleanup-interval: PT1H
  security:
    jwt:
      issuer: ledgerforge
      # Dev default only. Real deployments inject LEDGERFORGE_JWT_SECRET (>= 32 bytes) from a
      # secret store, or validate tokens from an identity provider instead.
      secret: ${LEDGERFORGE_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
      ttl: 1h
    dev-tokens:
      # POST /api/v1/auth/token mints tokens for any role. Never enable outside local/demo.
      enabled: ${LEDGERFORGE_DEV_TOKENS:false}
  outbox:
    relay:
      enabled: true
      poll-interval-ms: 500
      batch-size: 100
      initial-backoff: 1s
      max-backoff: 5m
      send-timeout: 10s
      retention: 7d
  kafka:
    consumers:
      enabled: true
    retry:
      initial-interval: 500ms
      multiplier: 2
      max-interval: 10s
      max-retries: 4
      partitions: 3
      replication-factor: 1
  rate-limit:
    payments:
      limit: 100
      window: 1m
  risk:
    large-amount-threshold: 10000.00
    rules:
      velocity:           # BLOCK
        max-attempts: 20
        window: 30s
      large-transaction:  # REVIEW
        threshold: 7500.00
        new-account-age: 30d
      repeated-failure:   # REVIEW
        max-failures: 5
        window: 10m
  webhooks:
    # Encrypts signing secrets at rest. Dev default only: real deployments inject
    # LEDGERFORGE_WEBHOOK_ENCRYPTION_KEY from a secret store.
    encryption-key: ${LEDGERFORGE_WEBHOOK_ENCRYPTION_KEY:dev-only-webhook-key-change-me}
    # Allows http:// and private addresses. Local development and tests only (SSRF risk).
    allow-insecure-urls: ${LEDGERFORGE_WEBHOOKS_ALLOW_INSECURE_URLS:false}
    max-endpoints-per-account: 10
    connect-timeout: 2s
    request-timeout: 5s
    # Wait after each failed attempt. Six attempts over ~1h13m, then the delivery is DEAD.
    retry-schedule: 10s, 30s, 2m, 10m, 1h
    dispatcher:
      enabled: true
      poll-interval-ms: 1000
      batch-size: 500
      max-in-flight: 500
      mode: VIRTUAL   # VIRTUAL or PLATFORM, see docs/virtual-threads.md
      platform-pool-size: 50
