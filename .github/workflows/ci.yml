name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MVN: ./mvnw -B -ntp

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: $MVN test-compile

      - name: Code style (Checkstyle)
        run: $MVN checkstyle:check

      # Each tier fails on its own, so a red build says at once what kind of problem it is.
      - name: Unit tests
        run: $MVN test -DexcludedGroups=integration

      # Testcontainers uses the Docker engine that ships with GitHub-hosted Ubuntu runners.
      - name: Integration tests
        run: $MVN test -Dgroups=integration -DexcludedGroups=concurrency,e2e

      - name: Concurrency tests
        run: $MVN test -Dgroups=concurrency

      - name: End-to-end tests
        run: $MVN test -Dgroups=e2e

      - name: Package
        run: $MVN package -DskipTests

      - name: Coverage report (JaCoCo)
        if: always()
        run: |
          $MVN jacoco:report || exit 0
          python3 .github/scripts/coverage_summary.py target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Race-condition report
        if: always()
        run: grep -h "\[race-report\]" target/surefire-reports/*-output.txt || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t ledgerforge:ci .

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Software bill of materials
        run: $MVN cyclonedx:makeAggregateBom

      - name: Scan with OSV-Scanner
        run: |
          docker run --rm -v "$PWD/target:/scan:ro" ghcr.io/google/osv-scanner:v2.7.0 \
            scan source -L /scan/bom.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/bom.json
