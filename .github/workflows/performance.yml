name: Performance tests

# On demand only. Load tests take a while and their numbers are worth reading, not gating on.
on:
  workflow_dispatch:
    inputs:
      users:
        description: Comma-separated user levels
        default: '50,100,500,1000'
      duration:
        description: Duration of each level
        default: '60s'

permissions:
  contents: read

jobs:
  load-test:
    name: k6 load test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose -f compose.yaml -f performance/compose.performance.yaml up -d --build --wait --wait-timeout 300

      - name: Run the load tests
        run: python3 performance/run.py --users "${{ inputs.users }}" --duration "${{ inputs.duration }}"

      - name: Summary
        if: always()
        run: cat performance/results/latest/results.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Application logs on failure
        if: failure()
        run: docker compose logs app --tail 200

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-results
          path: performance/results/latest
