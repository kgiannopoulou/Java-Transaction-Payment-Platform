# The whole platform with one command:
#
#   docker compose up                  API on http://localhost:8080, Grafana on http://localhost:3002
#   docker compose --profile demo up   the same, plus generated traffic for the dashboards
#
# For development: docker compose up -d postgres kafka redis, then ./mvnw spring-boot:run
#
# Dev tokens are enabled here (POST /api/v1/auth/token) so the API can be explored without an
# identity provider. These settings are for a local demo: never enable them anywhere else.
name: ledgerforge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledgerforge
      POSTGRES_USER: ledgerforge
      POSTGRES_PASSWORD: ledgerforge
    ports:
      - "5437:5432"   # 5437 on the host to avoid clashing with a local PostgreSQL
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerforge -d ledgerforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0   # KRaft, no ZooKeeper
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are declared by the application
    ports:
      - "9094:9094"   # host clients (./mvnw spring-boot:run) use localhost:9094
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7.4-alpine
    # No persistence, on purpose: everything in Redis is disposable by design (docs/redis.md).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6382:6379"   # 6382 on the host to avoid clashing with a local Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LEDGERFORGE_DB_URL: jdbc:postgresql://postgres:5432/ledgerforge
      LEDGERFORGE_DB_USER: ledgerforge
      LEDGERFORGE_DB_PASSWORD: ledgerforge
      LEDGERFORGE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LEDGERFORGE_REDIS_HOST: redis
      LEDGERFORGE_REDIS_PORT: 6379
      LEDGERFORGE_DEV_TOKENS: "true"
      LEDGERFORGE_WEBHOOKS_ALLOW_INSECURE_URLS: "true"   # receivers on the local network
      LEDGERFORGE_METRICS_PASSWORD: dev-only-metrics-password   # matches docker/prometheus/prometheus.yml
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs   # one JSON object per log line
    ports:
      - "${LEDGERFORGE_HTTP_PORT:-8080}:8080"

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${LEDGERFORGE_PROMETHEUS_PORT:-9091}:9090"   # 9091 on the host to avoid clashing with a local Prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.5.2
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Opens straight to the dashboard, read-only, with no login. For a local demo only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ledgerforge.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${LEDGERFORGE_GRAFANA_PORT:-3002}:3000"   # 3002 on the host to avoid clashing with local dev servers

  # Optional traffic so the dashboards have something to show.
  demo-traffic:
    profiles: [demo]
    image: alpine:3.21
    restart: on-failure   # starts over if the app restarts underneath it
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./docker/demo/traffic.sh:/traffic.sh:ro
    command: ["sh", "/traffic.sh"]

volumes:
  postgres-data:
  prometheus-data:
